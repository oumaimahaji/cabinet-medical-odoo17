name: CI/CD Pipeline - Cabinet Médical Odoo 17

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # JOB 1 : TESTS UNITAIRES & CONFORMITÉ IA / MÉTIER
  # =========================================================================
  unit-tests:
    name: Run 102 Automated Unit Tests (IA & Business Rules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies for testing
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib pandas numpy passlib openpyxl torch sentence-transformers

      - name: Execute Full Test Suite (102 Tests)
        run: |
          python custom_addons/cabinet_medical/tests/run_unit_tests.py

  # =========================================================================
  # JOB 2 : VÉRIFICATION DU BUILD DOCKER (DOCKER / DEPLOY)
  # =========================================================================
  docker-build:
    name: Build Docker Image (Odoo 17 Custom)
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom Odoo 17 image
        run: |
          docker build -t cabinet-medical-odoo:17.0 -f docker-deploy/Dockerfile . || docker build -t cabinet-medical-odoo:17.0 -f Dockerfile .
