version: '3.8'

services:
  # =========================================================================
  # 1. APPLICATION MÉDICALE : BASE DE DONNÉES POSTGRESQL 15
  # =========================================================================
  db:
    image: postgres:15
    container_name: cabinet_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo123
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================================================================
  # 2. APPLICATION MÉDICALE : SERVEUR ODOO 17 (AVEC MODULE CABINET_MEDICAL)
  # =========================================================================
  odoo:
    build:
      context: ..
      dockerfile: docker-deploy/Dockerfile
    container_name: cabinet_odoo
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo123
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../custom_addons:/mnt/extra-addons
    restart: unless-stopped

  # =========================================================================
  # 3. MONITORING : PROMETHEUS (COLLECTE DES MÉTRIQUES JENKINS & SERVEUR)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: cabinet_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  # =========================================================================
  # 4. MONITORING : GRAFANA (TABLEAUX DE BORD & DASHBOARDS CI/CD)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: cabinet_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  prometheus-data:
  grafana-data: