name: cabinet-deploy

services:
  # =========================================================================
  # 1. APPLICATION MÉDICALE : BASE DE DONNÉES POSTGRESQL 15
  # =========================================================================
  db:
    image: postgres:15
    container_name: cabinet_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================================================================
  # 2. APPLICATION MÉDICALE : SERVEUR ODOO 17 (AVEC MODULE CABINET_MEDICAL)
  # =========================================================================
  odoo:
    image: cabinet-medical-odoo:latest
    container_name: cabinet_odoo
    depends_on:
      - db
    environment:
      - HOST=${HOST}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - /vagrant/custom_addons:/mnt/extra-addons
      - /vagrant/docker-deploy/odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped

  # =========================================================================
  # 4. ASSISTANT IA LOCAL : OLLAMA (LLM MÉDICAL PHI-3 / TINYLLAMA)
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: cabinet_ollama
    # Port 11434 strictement interne au réseau bridge Docker (sécurité : non publié sur l'hôte)
    # Accessible uniquement par Odoo via la résolution DNS interne : http://ollama:11434
    volumes:
      - /vagrant/docker-deploy/ollama_data:/root/.ollama
    mem_limit: 4.5g
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
