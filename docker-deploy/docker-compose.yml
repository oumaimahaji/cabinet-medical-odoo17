name: cabinet-deploy

services:
  # =========================================================================
  # 1. APPLICATION MÉDICALE : BASE DE DONNÉES POSTGRESQL 15
  # =========================================================================
  db:
    image: postgres:15
    container_name: cabinet_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================================================================
  # 2. APPLICATION MÉDICALE : SERVEUR ODOO 17 (AVEC MODULE CABINET_MEDICAL)
  # =========================================================================
  odoo:
    image: cabinet-medical-odoo:latest
    container_name: cabinet_odoo
    depends_on:
      - db
    environment:
      - HOST=${HOST}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - /vagrant/custom_addons:/mnt/extra-addons
      - /vagrant/docker-deploy/odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped

  # =========================================================================
  # 3. ASSISTANT IA LOCAL : OLLAMA (LLM SOUVERAIN QWEN2.5:1.5B)
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: cabinet_ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    # Port 11434 strictement interne au réseau bridge Docker (sécurité : non publié sur l'hôte)
    # Accessible uniquement par Odoo via la résolution DNS interne : http://ollama:11434
    volumes:
      - /vagrant/docker-deploy/ollama_data:/root/.ollama
    mem_limit: 4.5g
    restart: unless-stopped

  # =========================================================================
  # 4. SUPERVISION : PROMETHEUS (COLLECTE DES MÉTRIQUES)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /vagrant/docker-deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  # =========================================================================
  # 5. SUPERVISION : GRAFANA (VISUALISATION DES MÉTRIQUES)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - /vagrant/docker-deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cabinet_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - odoo
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  prometheus-data:
  grafana-data:
