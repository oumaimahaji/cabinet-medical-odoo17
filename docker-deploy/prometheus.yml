global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Monitoring du serveur hôte / VM Ubuntu (CPU, Mémoire, Disque, Réseau)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['192.168.33.10:9100']

  # 2. Monitoring des performances et builds de Jenkins
  - job_name: 'jenkins'
    metrics_path: '/prometheus/'
    static_configs:
      - targets: ['192.168.33.10:8080']
